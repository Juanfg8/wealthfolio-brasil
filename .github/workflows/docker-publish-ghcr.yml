name: Publish GHCR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/juanfg8/wealthfolio-brasil

jobs:
  # Direct pushes to main (and workflow_dispatch) skip pr-check.yml's rust-check job
  # entirely, since that job only triggers on pull_request. This is the gap that let
  # a financial-correctness regression (b012cd310) ship to production undetected on
  # 2026-09-21: the water-tank invariant tests that would have caught it already
  # existed and were already red, but nothing in the push-to-main path ran them.
  # This job is deliberately narrow and fast (the two crates that hold the
  # performance engine and the Pluggy sync, not the full workspace/clippy/fmt/mobile
  # suite pr-check.yml already covers for PRs) so it gates every image build without
  # becoming the slow bureaucracy the project explicitly wants to avoid.
  financial-regression-gate:
    name: Financial regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Performance engine and Pluggy sync tests
        run: cargo test --locked -p wealthfolio-core -p wealthfolio-server --lib

  publish:
    needs: financial-regression-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          build-args: |
            GIT_SHA=${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
